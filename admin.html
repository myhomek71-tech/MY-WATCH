<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · MY-WATCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=Space+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<!-- Hide the page until the role check passes -->
<style>body{visibility:hidden}</style>
<script src="auth.js"></script>
<script>
  const session = Auth.require('admin');   // redirects to login.html if not an admin
  if (session) document.documentElement.insertAdjacentHTML('beforeend', '<style>body{visibility:visible}</style>');
</script>
</head>
<body>
<header class="bar">
  <div><span class="brand">MY-WATCH</span><span class="tag">Admin</span></div>
  <div class="bar-actions">
    <a class="ghost" href="index.html">View site</a>
    <button class="ghost" type="button" onclick="Auth.logout()">Sign out</button>
  </div>
</header>
<main>
  <span class="eyebrow">Dashboard</span>
  <h2 id="hello">Admin</h2>
  <p class="sub">Manage your MY-WATCH website from here.</p>
  <div class="grid">
    <div class="tile"><b id="count">0</b><span>Registered accounts</span></div>
    <div class="tile"><b>—</b><span>Products (connect your data)</span></div>
    <div class="tile"><b>—</b><span>Open orders (connect your data)</span></div>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Username</th><th>Name</th><th>Role</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
  if (session) {
    const A = Auth.ACCOUNTS;
    document.getElementById('hello').textContent = 'Welcome, ' + A[session.username].name;
    document.getElementById('count').textContent = Object.keys(A).length;
    document.getElementById('rows').innerHTML = Object.entries(A).map(([u, x]) =>
      `<tr><td>${Auth.esc(u)}</td><td>${Auth.esc(x.name)}</td><td>${Auth.esc(x.role)}</td></tr>`).join('');
  }
</script>
</body>
</html>
